<style>
/* === リセット・ベース === */
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --primary-light: #dbeafe;
  --success: #16a34a;
  --warning: #d97706;
  --danger: #dc2626;
  --gray-50: #f9fafb;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-300: #d1d5db;
  --gray-400: #9ca3af;
  --gray-500: #6b7280;
  --gray-600: #4b5563;
  --gray-700: #374151;
  --gray-800: #1f2937;
  --gray-900: #111827;
  --sidebar-w: 240px;
  --header-h: 56px;
  --radius: 8px;
  --shadow: 0 1px 3px rgba(0,0,0,.1), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 6px rgba(0,0,0,.1), 0 2px 4px rgba(0,0,0,.06);
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; color: var(--gray-800); background: var(--gray-50); font-size: 14px; }

/* === ログイン画面 === */
.login-wrapper { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); }
.login-card { background: #fff; border-radius: 12px; padding: 40px; width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.login-card h1 { font-size: 22px; text-align: center; margin-bottom: 8px; color: var(--gray-800); }
.login-card .subtitle { text-align: center; color: var(--gray-500); margin-bottom: 28px; font-size: 13px; }
.login-card .form-group { margin-bottom: 18px; }
.login-card label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--gray-600); }
.login-card input { width: 100%; padding: 10px 12px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px; transition: border-color .15s; }
.login-card input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.login-card .btn-login { width: 100%; padding: 11px; background: var(--primary); color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background .15s; }
.login-card .btn-login:hover { background: var(--primary-dark); }
.login-card .error-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; min-height: 20px; }

/* === アプリレイアウト === */
.app-wrapper { display: none; height: 100vh; }
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w); background: var(--gray-900); color: #fff; display: flex; flex-direction: column; z-index: 100; transition: transform .2s; }
.sidebar-header { padding: 16px 20px; border-bottom: 1px solid var(--gray-700); }
.sidebar-header h2 { font-size: 16px; font-weight: 700; }
.sidebar-header .company-name { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
.sidebar-nav .nav-section { padding: 8px 20px 4px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--gray-500); font-weight: 600; }
.sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 9px 20px; color: var(--gray-300); text-decoration: none; font-size: 13px; transition: all .1s; border-left: 3px solid transparent; }
.sidebar-nav a:hover { background: var(--gray-800); color: #fff; }
.sidebar-nav a.active { background: rgba(37,99,235,.15); color: var(--primary-light); border-left-color: var(--primary); font-weight: 600; }
.sidebar-nav a .icon { width: 18px; text-align: center; font-size: 15px; }
.sidebar-footer { padding: 12px 20px; border-top: 1px solid var(--gray-700); }
.sidebar-footer .user-info { font-size: 12px; color: var(--gray-400); margin-bottom: 8px; }
.sidebar-footer .user-info strong { color: #fff; }
.sidebar-footer .btn-logout { width: 100%; padding: 7px; background: transparent; color: var(--gray-400); border: 1px solid var(--gray-600); border-radius: 5px; font-size: 12px; cursor: pointer; transition: all .15s; }
.sidebar-footer .btn-logout:hover { background: var(--gray-800); color: #fff; }

/* === メインコンテンツ === */
.main-content { margin-left: var(--sidebar-w); min-height: 100vh; display: flex; flex-direction: column; }
.page-header { padding: 20px 28px 0; }
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--gray-800); }
.page-header .breadcrumb { font-size: 12px; color: var(--gray-500); margin-top: 2px; }
.page-body { padding: 20px 28px 40px; flex: 1; }

/* === カード === */
.card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-header { padding: 14px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
.card-header h3 { font-size: 15px; font-weight: 600; }
.card-body { padding: 20px; }
.card-body.no-pad { padding: 0; }

/* === ダッシュボード === */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); }
.stat-card .stat-label { font-size: 12px; color: var(--gray-500); font-weight: 500; }
.stat-card .stat-value { font-size: 26px; font-weight: 700; color: var(--gray-800); margin-top: 4px; }
.stat-card .stat-sub { font-size: 11px; color: var(--gray-400); margin-top: 2px; }
.stat-card.primary { border-left: 4px solid var(--primary); }
.stat-card.success { border-left: 4px solid var(--success); }
.stat-card.warning { border-left: 4px solid var(--warning); }
.stat-card.danger { border-left: 4px solid var(--danger); }

/* === テーブル === */
.table-wrapper { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th { background: var(--gray-50); padding: 10px 14px; text-align: left; font-weight: 600; color: var(--gray-600); border-bottom: 2px solid var(--gray-200); white-space: nowrap; }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--gray-100); color: var(--gray-700); }
tbody tr:hover { background: var(--gray-50); }
.text-right { text-align: right; }
.text-center { text-align: center; }
.text-mono { font-family: 'SF Mono', 'Consolas', monospace; }

/* === ボタン === */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; text-decoration: none; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-secondary { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-300); }
.btn-secondary:hover { background: var(--gray-200); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px 8px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-group { display: flex; gap: 8px; }

/* === フォーム === */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-600); margin-bottom: 5px; }
.form-group label .required { color: var(--danger); margin-left: 2px; }
.form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 14px; color: var(--gray-800); background: #fff; transition: border-color .15s; }
.form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
select.form-control { appearance: auto; }
textarea.form-control { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.form-hint { font-size: 11px; color: var(--gray-400); margin-top: 3px; }
.form-error { font-size: 12px; color: var(--danger); margin-top: 3px; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--gray-200); }

/* === モーダル === */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-lg { width: 720px; }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--gray-200); display: flex; align-items: center; justify-content: space-between; }
.modal-header h3 { font-size: 16px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--gray-400); padding: 4px 8px; border-radius: 4px; }
.modal-close:hover { background: var(--gray-100); color: var(--gray-600); }
.modal-body { padding: 20px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--gray-200); display: flex; gap: 8px; justify-content: flex-end; }

/* === ツールバー === */
.toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.toolbar .search-input { padding: 8px 12px; border: 1px solid var(--gray-300); border-radius: 6px; font-size: 13px; min-width: 200px; }
.toolbar .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
.toolbar .spacer { flex: 1; }

/* === バッジ === */
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-active { background: #dcfce7; color: #166534; }
.badge-inactive { background: var(--gray-100); color: var(--gray-500); }
.badge-admin { background: #fef3c7; color: #92400e; }
.badge-editor { background: var(--primary-light); color: var(--primary-dark); }

/* === トースト === */
.toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); animation: toastIn .2s ease-out; min-width: 280px; display: flex; align-items: center; gap: 8px; }
.toast-success { background: var(--success); }
.toast-error { background: var(--danger); }
.toast-warning { background: var(--warning); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

/* === ローディング === */
.loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--gray-400); }
.spinner { width: 24px; height: 24px; border: 3px solid var(--gray-200); border-top-color: var(--primary); border-radius: 50%; animation: spin .6s linear infinite; margin-right: 10px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* === タブ === */
.tabs { display: flex; border-bottom: 2px solid var(--gray-200); margin-bottom: 20px; }
.tab { padding: 10px 20px; font-size: 13px; font-weight: 500; color: var(--gray-500); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; }
.tab:hover { color: var(--gray-700); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

/* === 空状態 === */
.empty-state { text-align: center; padding: 48px 20px; color: var(--gray-400); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state p { font-size: 14px; margin-bottom: 16px; }

/* === レスポンシブ === */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .form-row, .form-row-3 { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .modal { width: 95vw; }
}
</style>
